<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E66" />
      <stop offset="50%" stop-color="#FF6D29" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    
    <!-- Shadow/Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF6D29" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Premium Application Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#161316" stroke="url(#logoGrad)" stroke-width="8" stroke-opacity="0.2" />

  <g filter="url(#glow)">
    <!-- Main A-J monogram path (A left leg, apex, and right leg curving into a J) -->
    <path d="M 160 370 L 256 140 L 352 350 C 362 380, 340 420, 290 420 C 240 420, 220 380, 230 340" 
          stroke="url(#logoGrad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Crossbar of the A -->
    <path d="M 205 285 L 305 285" 
          stroke="url(#logoGrad)" 
          stroke-width="48" 
          stroke-linecap="round" />
  </g>
</svg>
